<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Startsida</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!--Header-->
    <header>
        <h1>Laboration 4</h1>

        <!--Navigering-->
        <nav>
            <ul>
                <li class="you-are-here"><a href="/">Startsida</a></li>
                <li><a href="login.html">Logga in</a></li>
            </ul>
        </nav>

    </header>

    <!--Main-->
    <div class="container">
        <main>
            <h2>Regristrera dig här!</h2>

            <!--Formulär-->
            <form id="register-form">
                <label for="username">Användarnamn:</label><br>
                <input type="text" id="username" name="username" placeholder="Användarnamn..."><br>

                <label for="password">Lösenord:</label><br>
                <input type="password" id="password" name="password" placeholder="Lösenord..."><br>

                <button type="submit" class="add-button">Registrera</button>

                <ul id="error-messages"></ul>
            </form>
        </main>

    </div>

    <!--Footer-->
    <footer>
        <p>Av: Frida Ljungberg, 2026.</p>
    </footer>

    <script src="js/register.js"></script>
</body>

</html>
